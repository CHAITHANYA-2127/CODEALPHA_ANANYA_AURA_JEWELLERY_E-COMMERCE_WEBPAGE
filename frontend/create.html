<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Create Account - Ananya Aura Jewellery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="create.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div class="card register-card">

    <img src="ananya.jpeg" class="logo-img" alt="Logo">

    <h2 class="text-center">Create Account</h2>

    <p class="text-center subtitle">
        Join Ananya Aura Jewellery and discover timeless elegance
    </p>

    <form>

        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullname" placeholder="Enter Full Name" required>

        <label class="form-label mt-3">Mobile Number</label>
        <input type="tel" class="form-control" id="mobile" placeholder="10 Digit Mobile Number"
        pattern="[0-9]{10}" maxlength="10" required>

        <label class="form-label mt-3">Date of Birth</label>
        <input type="date" class="form-control" id="dob" required>

        <label class="form-label mt-3">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="name@gmail.com" required>

        <label class="form-label mt-3">Username</label>
        <input type="text" class="form-control" id="username" placeholder="Choose Username" required>

        <label class="form-label mt-3">Address</label>
        <textarea class="form-control" id="address" rows="3" placeholder="Enter Address" required></textarea>

        <div class="row mt-3">

            <div class="col-md-6">
                <label class="form-label">State</label>
                <input type="text" class="form-control" id="state" placeholder="State" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">City</label>
                <input type="text" class="form-control" id="city" placeholder="City" required>
            </div>

        </div>

        <label class="form-label mt-3">Pincode</label>
        <input type="text" class="form-control" id="pincode"
        placeholder="Pincode"
        pattern="[0-9]{6}"
        maxlength="6"
        required>

        <label class="form-label mt-3">Password</label>

        <div class="password-box">
            <input type="password"
            class="form-control"
            id="password"
            placeholder="Create Password"
            required>

            <i class="bi bi-eye-fill eye-icon" id="togglePassword"></i>
        </div>

        <label class="form-label mt-3">Confirm Password</label>

        <div class="password-box">
            <input type="password"
            class="form-control"
            id="confirmPassword"
            placeholder="Confirm Password"
            required>

            <i class="bi bi-eye-fill eye-icon" id="toggleConfirm"></i>
        </div>

        <small class="text-warning d-block mt-2">
            Password must contain 8 characters, 1 capital letter,
            1 number and 1 special character.
        </small>

        <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" required>
            <label class="form-check-label">
                I agree to Terms & Conditions
            </label>
        </div>

        <button type="submit" id="registerBtn" class="btn btn-register w-100 mt-4">
            CREATE ACCOUNT
        </button>

    </form>

    <p class="text-center mt-4">
        Already have an account?
        <a href="./login.html">Login</a>
    </p>

</div>

<script>
const API_BASE_URL = "http://127.0.0.1:8000";
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const passwordPattern = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}$/;

function toggleInput(input, icon){
    input.type = input.type === "password" ? "text" : "password";
    icon.classList.toggle("bi-eye-fill");
    icon.classList.toggle("bi-eye-slash-fill");
}

document.getElementById("togglePassword").addEventListener("click", function(){
    toggleInput(password, this);
});

document.getElementById("toggleConfirm").addEventListener("click", function(){
    toggleInput(confirmPassword, this);
});

document.querySelector("form").addEventListener("submit", function(e){
    e.preventDefault();

    const payload = {
        full_name: document.getElementById("fullname").value.trim(),
        phone: document.getElementById("mobile").value.trim(),
        dob: document.getElementById("dob").value,
        email: document.getElementById("email").value.trim(),
        username: document.getElementById("username").value.trim(),
        address: document.getElementById("address").value.trim(),
        state: document.getElementById("state").value.trim(),
        city: document.getElementById("city").value.trim(),
        pincode: document.getElementById("pincode").value.trim(),
        password: password.value
    };

    if(!payload.full_name || !payload.phone || !payload.dob || !payload.email || !payload.username || !payload.address || !payload.state || !payload.city || !payload.pincode || !payload.password){
        alert("Please fill all required fields");
        return;
    }

    if(!/^[0-9]{10}$/.test(payload.phone)){
        alert("Please enter a valid 10 digit mobile number");
        return;
    }

    if(!/^[0-9]{6}$/.test(payload.pincode)){
        alert("Please enter a valid 6 digit pincode");
        return;
    }

    if(!passwordPattern.test(password.value)){
        alert("Password must contain 8 characters, 1 capital letter, 1 number and 1 special character.");
        return;
    }

    if(password.value !== confirmPassword.value){
        alert("Passwords do not match");
        return;
    }

    fetch(`${API_BASE_URL}/register/`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if(data.success){
            if(data.user){
                localStorage.setItem("user_id", data.user.id);
                localStorage.setItem("profile", JSON.stringify({
                    name: data.user.full_name || data.user.username,
                    username: data.user.username,
                    email: data.user.email,
                    phone: data.user.phone || payload.phone,
                    dob: data.user.dob || payload.dob,
                    address: data.user.address || payload.address,
                    photo: "ananya.jpeg",
                    memberSince: new Date().toLocaleString("en-IN", { month: "long", year: "numeric" })
                }));
            }
            alert("Registration Successful");
            window.location.href = "login.html";
            return;
        }

        alert(data.message || "Registration failed");
    })
    .catch(error => {
        console.log("Backend offline, saving user locally:", error);
        let users = JSON.parse(localStorage.getItem("registered_users") || "[]");
        users.push(payload);
        localStorage.setItem("registered_users", JSON.stringify(users));
        localStorage.setItem("user_id", "1");
        localStorage.setItem("profile", JSON.stringify({
            name: payload.full_name || payload.username,
            username: payload.username,
            email: payload.email,
            phone: payload.phone,
            dob: payload.dob,
            address: payload.address,
            photo: "ananya.jpeg",
            memberSince: new Date().toLocaleString("en-IN", { month: "long", year: "numeric" })
        }));
        alert("Registration Successful");
        window.location.href = "login.html";
    });
});
</script>

</body>
</html>
